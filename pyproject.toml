[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "todo-cli"
version = "1.0.0"
description = "A simple terminal TODO application"
requires-python = ">=3.9"

[project.scripts]
todo = "todo_cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]